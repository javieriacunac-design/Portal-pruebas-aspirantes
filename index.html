<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba técnica Armador Tubero 1A — INDIMON SAS</title>
<style>
:root{--blue:#1F4E79;--blue2:#2E75B6;--lb:#DCE6F1;--grey:#F2F4F7;--ink:#1b1f24;--dim:#5b6571;--red:#C0392B;--ok:#1E8449;--line:#cfd6de}
*{box-sizing:border-box}
html,body{margin:0;background:#eef1f5;color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header.top .brand{font-weight:700;letter-spacing:.5px}
header.top .sec{flex:1;font-size:14px;opacity:.95}
header.top .timer{font:700 22px/1 ui-monospace,Consolas,monospace;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:8px;min-width:96px;text-align:center}
header.top .timer.low{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
button{font:inherit;cursor:pointer}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn:hover{background:var(--blue2)}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);padding:6px 12px;font-size:13px}
.btn.danger{background:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{max-width:900px;margin:0 auto;padding:18px 14px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 14px}
h1{font-size:26px;margin:0 0 4px;color:var(--blue)}
h2{font-size:19px;margin:0 0 8px;color:var(--blue)}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--dim);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:10px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid #b9c3cf;border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue2);outline-offset:0}
ul.rules{margin:6px 0 0;padding-left:20px}ul.rules li{margin:3px 0}
.q{padding:12px 0;border-top:1px solid var(--grey)}.q:first-child{border-top:0}
.q .stem{font-weight:600;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--grey)}
.opt input{margin-top:4px}
.opt.sel{background:var(--lb);border-color:var(--blue2)}
.noselect{user-select:none;-webkit-user-select:none}
.sym{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--grey)}
.sym img{width:150px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.fig{text-align:center;margin:8px 0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#fff}
.fig2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.fig2{grid-template-columns:1fr}}
.fig .cap{font-size:12.5px;color:var(--dim);font-weight:600}
.afield{display:grid;grid-template-columns:1fr 150px 54px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--grey)}
.afield:first-of-type{border-top:0}
.afield .u{color:var(--dim);font-size:13px}
@media(max-width:640px){.afield{grid-template-columns:1fr 120px 44px}}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:15}
.bar .info{font-size:13px;color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.modal .box.wide{max-width:1100px}
.modal img{max-width:100%}
table.t{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:14px}
table.t th{background:var(--blue);color:#fff;padding:6px 8px;text-align:center}
table.t td{border:1px solid var(--line);padding:5px 8px;text-align:center}
table.t tr:nth-child(even) td{background:var(--grey)}
table.t td.l{text-align:left}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
.pill.ok{background:#D5F5E3;color:var(--ok)}.pill.bad{background:#FADBD8;color:var(--red)}.pill.warn{background:#FCF3CF;color:#9A7D0A}
.warnbar{background:#FCF3CF;border:1px solid #F7DC6F;border-radius:8px;padding:6px 12px;font-size:13px;margin-bottom:12px}
.code{font:12px/1.4 ui-monospace,Consolas,monospace;word-break:break-all;background:var(--grey);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:140px;overflow:auto}
.hide{display:none!important}
a.btn{text-decoration:none;display:inline-block}
.btn.sm{padding:5px 10px;font-size:13px}
.logo{display:block;height:64px;width:auto;margin:0 0 10px}
.tw{overflow-x:auto}
details summary{cursor:pointer;margin-top:6px}
.err{color:var(--red);font-weight:600;margin-top:6px}
.big{font-size:42px;font-weight:800;color:var(--blue);line-height:1}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--red);font-weight:700}
</style>
</head>
<body>
<header class="top" id="hdr">
  <span class="brand">INDIMON SAS</span>
  <span class="sec" id="hsec">Prueba técnica · Armador Tubero 1A</span>
  <button class="btn ghost hide" id="btnAnnex">Hoja de datos</button>
  <span class="timer hide" id="timer">--:--</span>
</header>
<main id="app"></main>

<div class="modal" id="mAnnex"><div class="box"><h2>Anexo 1 · Hoja de datos</h2><div id="annexBody"></div><div style="text-align:right"><button class="btn" data-close>Cerrar</button></div></div></div>
<div class="modal" id="mImg"><div class="box wide"><div style="text-align:right;margin-bottom:6px"><button class="btn" data-close>Cerrar</button></div><img id="bigImg" alt=""></div></div>
<div class="modal" id="mConfirm"><div class="box"><h2 id="cfT"></h2><p id="cfP"></p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" id="cfNo">Volver</button><button class="btn danger" id="cfYes">Confirmar</button></div></div></div>

<script src="config.js"></script>

  const fl = u8(); P.mode = fl & 1 ? "Remota" : "Presencial"; P.att = !!(fl & 2);
  let vv = u16(); EXIDS.forEach(id => { P.var[id] = vv % 3; vv = Math.floor(vv / 3); });
  P.blur = u8();
  QQ.parts.forEach(pt => { P.times[pt.id] = u16() * 1000; });
  const items = []; MCQP.forEach(pid => QQ.mcq[pid].forEach(it => items.push(it)));
  for (let i = 0; i < items.length; i += 3) { let b = u8(); for (let j = 0; j < 3 && i + j < items.length; j++) { const d = b % 5; b = Math.floor(b / 5); if (d < 4) P.answers[items[i + j].id] = items[i + j].opts[d]; } }
  const keys = QQ.b.sym.map(s => ["B1." + s.k, QQ.b.names]).concat(QQ.b.abbr.map(a => ["B2." + a, QQ.b.means]));
  for (let i = 0; i < keys.length; i += 2) { const b = u8(); [b >> 4, b & 15].forEach((d, j) => { if (i + j < keys.length && d < keys[i + j][1].length) P.answers[keys[i + j][0]] = keys[i + j][1][d]; }); }
  EXIDS.forEach(id => QQ.ex[id][P.var[id]].fields.forEach(f => { const v = vint(); if (v === 0) return; P.answers[id + "." + f.k] = v === 1 ? "(no numérico)" : String((v - 2) / 100); }));
  P.doc = str(); P.name = str();
  if (p !== u.length) throw new Error("longitud");
  return P;
}

async function rkKey(rk, uses) { return crypto.subtle.importKey("raw", b64d(rk), "AES-GCM", false, uses); }
async function sealCode(St) {
  const bytes = packResult(St, Q), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, tagLength: 64 }, await rkKey(Q.rk, ["encrypt"]), bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return "T2x" + b62e(out);
}
async function openCode(text, K) {
  const tryOne = async s => {
    const m = /T2x([0-9A-Za-z]{120,})/.exec(s); if (!m) throw new Error("formato");
    const raw = b62d(m[1]);
    const pt = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12), tagLength: 64 }, await rkKey(K.rk, ["decrypt"]), raw.slice(12)));
    return { P: unpackResult(pt, K.q), code: "T2x" + m[1] };
  };
  try { return await tryOne(String(text)); } catch (e) { return await tryOne(String(text).replace(/\s+/g, "")); }
}
async function sealJson(obj, rk) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await rkKey(rk, ["encrypt"]), new TextEncoder().encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64e(out);
}
async function openJson(b64, rk) {
  const raw = b64d(b64);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, await rkKey(rk, ["decrypt"]), raw.slice(12))));
}

/* ---------- aleatoriedad determinista ---------- */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, key) { const r = mulberry(hashStr(S.seed + "|" + key)), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const r = mulberry(hashStr(seed + "|var"));

/* ---------- calificación ---------- */
function grade(P, K) {
  const QQ = K.q, R = { parts: {}, mcq: [], ex: [], crit: [] };
  const add = (pid, g, m) => { const r = R.parts[pid] || (R.parts[pid] = { got: 0, max: 0 }); r.got += g; r.max += m; };
  ["A", "C", "D"].forEach(pid => {
    QQ.mcq[pid].forEach((it, i) => { const k = K.mcq[it.id], a = P.answers[it.id], ok = a === k.ans; add(pid, ok ? 1 : 0, 1); R.mcq.push({ n: pid + (i + 1), ok, a: a || "(en blanco)", c: k.ans, crit: k.crit }); if (k.crit && !ok) R.crit.push(pid + (i + 1)); });
  });
  QQ.b.sym.forEach((s, i) => { const a = P.answers["B1." + s.k], c = K.b.sym[s.k], ok = a === c; add("B", ok ? 1 : 0, 1); R.mcq.push({ n: "B1 símbolo " + (i + 1), ok, a: a || "(en blanco)", c }); });
  QQ.b.abbr.forEach(s => { const a = P.answers["B2." + s], c = K.b.abbr[s], ok = a === c; add("B", ok ? 1 : 0, 1); R.mcq.push({ n: "B2 " + s, ok, a: a || "(en blanco)", c }); });
  EXIDS.forEach(id => {
    const v = P.var[id], key = K.ex[id][v], ex = QQ.ex[id][v], pid = id === "F" ? "F" : "E";
    ex.fields.forEach(f => {
      const kk = key[f.k], raw = P.answers[id + "." + f.k], x = num(raw), ok = !isNaN(x) && Math.abs(x - kk.ans) <= kk.tol + 1e-9;
      add(pid, ok ? kk.pts : 0, kk.pts);
      R.ex.push({ id, label: f.label, unit: f.unit, a: raw === undefined ? "(en blanco)" : raw, c: kk.ans, tol: kk.tol, ok, pts: kk.pts, sol: kk.sol });
    });
  });
  R.total = Object.values(R.parts).reduce((s, p) => s + p.got, 0);
  const ef = R.parts.E.got + R.parts.F.got, d = R.parts.D.got;
  let lvl = R.total >= 80 ? 3 : R.total >= 65 ? 2 : R.total >= 50 ? 1 : 0;
  if (lvl === 3 && (ef < 30 || d < 6)) lvl = (ef >= 22 && d >= 6) ? 2 : 1;
  if (lvl === 2 && (ef < 22 || d < 6)) lvl = 1;
  R.lvl = ["No apto", "Condicionado", "Apto", "Sobresaliente"][lvl]; R.ef = ef;
  R.safety = R.crit.length >= 2;
  return R;
}
function reportHtml(R, P, K) {
  const QQ = K.q, pill = ok => `<span class="pill ${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"}</span>`;
  const mins = ms => ms === undefined ? "—" : (ms / 60000).toFixed(1) + " min";
  let h = `<div class="card"><h2>Resultado de la prueba escrita</h2><div class="score"><div><div class="big">${R.total}<span style="font-size:20px">/100</span></div><div class="muted">${esc(P.name)} · ${esc(P.doc)} · ${new Date(P.t1).toLocaleString("es-CO")}</div></div>
    <div><div class="pill ${R.lvl === "No apto" ? "bad" : R.lvl === "Condicionado" ? "warn" : "ok"}" style="font-size:15px">${R.lvl}</div><div class="muted" style="margin-top:4px">Nivel escrito sugerido (la práctica se califica aparte)</div></div></div>
    ${R.safety ? `<p class="bad-t">⚑ Regla de seguridad: ${R.crit.length} ítems críticos fallados (${R.crit.join(", ")}). No avanza, sin importar el puntaje.</p>` : (R.crit.length ? `<p class="muted">Ítem crítico fallado: ${R.crit.join(", ")}</p>` : "")}
    <div class="tw"><table class="t"><tr><th>Parte</th><th>Puntos</th><th>Máx.</th><th>Tiempo usado</th></tr>${QQ.parts.map(p => `<tr><td class="l">${p.id} · ${esc(p.name)}</td><td>${R.parts[p.id].got}</td><td>${p.pts}</td><td>${mins((P.times || {})[p.id])}</td></tr>`).join("")}<tr><td class="l"><b>Total</b></td><td><b>${R.total}</b></td><td>100</td><td>${mins(Object.values(P.times || {}).reduce((a, b) => a + b, 0))}</td></tr></table></div>
    <p class="muted">Modalidad: <b>${esc(P.mode || "—")}</b>${P.att ? " · declaración aceptada" : ""}. Pérdidas de foco de la ventana: <b>${P.blur || 0}</b>${(P.blur || 0) > 3 ? " — revisar con el aspirante" : ""}. Variantes: ${Object.entries(P.var).map(([k, v]) => k + "=" + (v + 1)).join(", ")}.</p></div>`;
  h += `<div class="card"><h2>Ejercicios E y F</h2><div class="tw"><table class="t"><tr><th>Ej.</th><th>Ítem</th><th>Aspirante</th><th>Correcto (±tol.)</th><th></th></tr>` +
    R.ex.map(x => `<tr><td>${x.id}</td><td class="l">${esc(x.label)}</td><td>${esc(x.a)}</td><td>${x.c}${x.tol ? " ± " + x.tol : ""} ${esc(x.unit)}</td><td>${pill(x.ok)}</td></tr><tr><td></td><td class="l muted" colspan="4">${esc(x.sol)}</td></tr>`).join("") + `</table></div>
    <p class="muted">Calificación automática: no aplica el «50 % sin procedimiento» ni el error arrastrado de la guía. Si el puntaje queda cerca de un umbral, pida al aspirante que explique su procedimiento.</p></div>`;
  h += `<div class="card"><h2>Partes A, B, C y D</h2><div class="tw"><table class="t"><tr><th>Ítem</th><th>Aspirante</th><th>Correcta</th><th></th></tr>` +
    R.mcq.map(x => `<tr><td>${x.n}${x.crit ? " ⚑" : ""}</td><td class="l">${esc(x.a)}</td><td class="l">${esc(x.c)}</td><td>${pill(x.ok)}</td></tr>`).join("") + `</table></div></div>`;
  return h;
}

/* ---------- portal del evaluador ---------- */
let EV = null;
const DECS = ["Pendiente", "Citar a práctica", "Apto", "Condicionado", "No apto", "Contratado"];

function screenEval(prefill) {
  inExam = false; clearInterval(tickH); setHeader("Portal del evaluador", false, false);
  if (EV) return screenPortal(prefill);
  app.innerHTML = `<div class="card">${LOGO ? `<img src="${LOGO}" alt="INDIMON" class="logo">` : ""}<h1>Portal del evaluador</h1>
  <p class="muted">Registro y calificación de resultados · Base de datos de aspirantes</p>
  <label class="f" style="max-width:340px">PIN de calificación<input type="password" id="gPin" data-allow="1" autocomplete="off"></label>
  <div id="gErr" class="err"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bIn">Entrar</button><button class="btn sec" id="bBack">Ir a la prueba (vista del aspirante)</button></div></div>`;
  $("#bBack").onclick = () => { if (S && S.phase === "done") screenDone(); else screenIntro(true); };
  const go = async () => {
    const err = $("#gErr"); err.textContent = "Verificando…"; $("#bIn").disabled = true;
    try { const K = await decrypt(ENC_K, $("#gPin").value); EV = { K, rows: [], loaded: false, bad: 0 }; } catch (e) { err.textContent = "PIN incorrecto."; $("#bIn").disabled = false; return; }
    screenPortal(prefill);
  };
  $("#bIn").onclick = go; $("#gPin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

async function loadRows() {
  EV.rows = []; EV.bad = 0; EV.loaded = false; EV.dbErr = "";
  if (!API) { EV.loaded = true; return; }
  try {
    const j = await api({ a: "list", tok: EV.K.tok }, 30000);
    for (const d of j.rows) {
      try {
        const { P, code } = await openCode(d.c, EV.K);
        let ev = {}; if (d.x) { try { ev = await openJson(d.x, EV.K.rk); } catch (e) { ev = {}; } }
        EV.rows.push({ id: d.id, P, R: grade(P, EV.K), ev, code, src: d.src || "" });
      } catch (e) { EV.bad++; }
    }
    EV.rows.sort((a, b) => b.P.t1 - a.P.t1);
  } catch (e) { EV.dbErr = "No se pudo leer la hoja de resultados (" + (e.message || "error") + "). Revise la conexión y vuelva a entrar."; }
  EV.loaded = true;
}
async function saveRow(row) {
  const x = Object.keys(row.ev || {}).length ? await sealJson(row.ev, EV.K.rk) : "";
  await api({ a: "ev", tok: EV.K.tok, id: row.id, x, total: row.R.total, lvl: row.R.lvl, prac: row.ev.prac === undefined ? "" : row.ev.prac, dec: row.ev.dec || "Pendiente" });
}
async function addRow(row) {
  await api({ a: "add", tok: EV.K.tok, id: row.id, name: row.P.name, doc: row.P.doc, mode: row.P.mode, t1: row.P.t1, c: row.code });
  await saveRow(row);
}

async function screenPortal(prefill) {
  setHeader("Portal del evaluador", false, false);
  const K = EV.K;
  app.innerHTML = `<div class="card">${LOGO ? `<img src="${LOGO}" alt="INDIMON" class="logo">` : ""}<h1>Portal del evaluador</h1>
    <p class="muted">Prueba técnica Armador Tubero 1A</p><div id="dbMsg" class="warnbar">Cargando resultados…</div>
    <details><summary><b>Enviar la prueba a un aspirante</b></summary>
      <p style="margin:8px 0 4px">Enlace de la prueba: <span class="code" style="display:inline-block;padding:3px 8px" data-allow="1">${esc(location.href.split("#")[0].split("?")[0])}</span></p>
      <button class="btn sec" id="bInv">Copiar mensaje de invitación</button> <span id="invMsg" class="muted"></span></details></div>
  <div class="card"><details id="manBox"><summary><b>Registrar un código manualmente</b> <span class="muted">(solo si un envío automático falló)</span></summary>
    <p class="muted">Solo si el envío automático del aspirante falló: pegue el código (o el mensaje completo de WhatsApp) que le envió.</p>
    <textarea id="gCode" data-allow="1" placeholder="Pegue aquí el código del aspirante">${esc(prefill || "")}</textarea>
    <div id="gErr" class="err"></div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bReg">Registrar y calificar</button><button class="btn sec" id="bRef">Actualizar lista</button><button class="btn sec" id="bOut">Cerrar portal</button><button class="btn sec" id="bExam">Ir a la prueba (vista del aspirante)</button></div></details></div>
  <div class="card"><h2>Base de datos de aspirantes</h2>
    <div class="grid2"><label class="f">Buscar<input type="text" id="hQ" data-allow="1" placeholder="nombre o documento"></label>
    <label class="f">Decisión<select id="hF"><option value="">Todas</option>${DECS.map(d => `<option>${d}</option>`).join("")}</select></label></div>
    <div id="hTab" class="tw"></div>
    <div style="margin-top:10px"><button class="btn sec" id="hCsv">Copiar tabla para Excel</button> <span id="hMsg" class="muted"></span></div></div>
  <div id="rep"></div>`;
  const invite = `Prueba técnica Armador Tubero 1A - INDIMON SAS\nEnlace: ${location.href.split("#")[0].split("?")[0]}\nDuración: 90 minutos. Use computador o tablet con Chrome e internet estable. Tenga a mano calculadora científica, lápiz y papel.\nEscriba su nombre y documento, y presione Iniciar. Al terminar, el resultado se envía solo.`;
  $("#bInv").onclick = async () => { try { await navigator.clipboard.writeText(invite); $("#invMsg").textContent = "Copiado."; } catch (e) { $("#invMsg").textContent = "No se pudo copiar."; } };
  $("#bOut").onclick = () => { EV = null; screenIntro(true); };
  $("#bRef").onclick = async () => { $("#dbMsg").className = "warnbar"; $("#dbMsg").textContent = "Cargando resultados…"; await loadRows(); dbStatus(); drawTable(); };
  $("#bExam").onclick = () => { if (S && S.phase === "done") screenDone(); else screenIntro(true); };
  $("#hQ").oninput = drawTable; $("#hF").onchange = drawTable;
  $("#hCsv").onclick = copyTable;
  $("#bReg").onclick = registerCode;
  if (!EV.loaded) await loadRows();
  if (!$("#dbMsg")) return;
  dbStatus();
  drawTable();
  if (prefill) registerCode();
}

function dbStatus() {
  const m = $("#dbMsg"); if (!m) return;
  if (EV.dbErr) { m.className = "warnbar"; m.textContent = EV.dbErr; }
  else if (API) { m.className = "muted"; m.textContent = `Conectado a la hoja de resultados: ${EV.rows.length} aspirante(s)` + (EV.bad ? ` · ${EV.bad} registro(s) ilegible(s) o alterado(s)` : "") + "."; }
  else { m.className = "warnbar"; m.textContent = "Sin conexión configurada (archivo config.js): puede calificar códigos pegados, pero no quedan guardados."; }
}
function drawTable() {
  const box = $("#hTab"); if (!box) return;
  const q = ($("#hQ").value || "").trim().toLowerCase(), f = $("#hF").value;
  const rows = EV.rows.filter(r => (!q || (r.P.name + " " + r.P.doc).toLowerCase().includes(q)) && (!f || (r.ev.dec || "Pendiente") === f));
  if (!rows.length) { box.innerHTML = `<p class="muted">${EV.rows.length ? "Ningún aspirante coincide con el filtro." : "Aún no hay aspirantes registrados."}</p>`; return; }
  box.innerHTML = `<table class="t"><tr><th>Fecha</th><th>Aspirante</th><th>Documento</th><th>Modal.</th><th>Escrito</th><th>Nivel</th><th>⚑</th><th>Foco</th><th>Práctica</th><th>Decisión</th><th></th></tr>` +
    rows.map(r => `<tr><td>${new Date(r.P.t1).toLocaleDateString("es-CO")}</td><td class="l">${esc(r.P.name)}</td><td>${esc(r.P.doc)}</td><td>${esc(r.P.mode)}</td><td><b>${r.R.total}</b></td><td>${esc(r.R.lvl)}</td><td>${r.R.crit.length}</td><td>${r.P.blur}</td><td>${r.ev.prac === undefined || r.ev.prac === "" ? "—" : esc(r.ev.prac)}</td><td>${esc(r.ev.dec || "Pendiente")}</td><td><button class="btn sec sm" data-open="${esc(r.id)}">Ver</button></td></tr>`).join("") + `</table>`;
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => showDetail(EV.rows.find(r => r.id === b.dataset.open)));
}

async function registerCode() {
  const err = $("#gErr"); err.className = "err"; err.textContent = "Leyendo código…";
  let res;
  try { res = await openCode($("#gCode").value, EV.K); } catch (e) { err.textContent = "Código inválido, incompleto o alterado. Pida al aspirante que lo copie de nuevo."; return; }
  const P = res.P, id = rowId(P);
  let row = EV.rows.find(r => r.id === id);
  const isNew = !row;
  if (isNew) { row = { id, P, R: grade(P, EV.K), ev: {}, code: res.code, t: Date.now() }; EV.rows.unshift(row); }
  let saved = false, why = "";
  if (API && isNew) { try { await addRow(row); saved = true; } catch (e) { why = e.message || "error"; } }
  err.className = saved || !isNew ? "ok-t" : "muted";
  err.textContent = !isNew ? "Este resultado ya estaba registrado." : saved ? "Resultado registrado y guardado en la hoja." : API ? "Calificado, pero NO se pudo guardar (" + why + "). Intente de nuevo." : "Calificado (sin guardar: no hay conexión configurada).";
  if (isNew && API && !saved) EV.rows = EV.rows.filter(r => r !== row);
  $("#gCode").value = "";
  dbStatus();
  drawTable(); showDetail(row);
}

function showDetail(row) {
  const rep = $("#rep"); if (!rep || !row) return;
  const ev = row.ev || {};
  rep.innerHTML = `<div class="card"><h2>Seguimiento · ${esc(row.P.name)}</h2>
    <div class="grid2"><label class="f">Puntaje de la práctica (0–100)<input type="text" inputmode="numeric" id="evP" data-allow="1" value="${esc(ev.prac === undefined ? "" : ev.prac)}"></label>
    <label class="f">Decisión<select id="evD">${DECS.map(d => `<option${(ev.dec || "Pendiente") === d ? " selected" : ""}>${d}</option>`).join("")}</select></label></div>
    <div class="grid2"><label class="f">Ciudad<input type="text" id="evC" data-allow="1" maxlength="60" value="${esc(ev.city || "")}"></label>
    <label class="f">Teléfono de contacto<input type="text" id="evT" data-allow="1" maxlength="30" value="${esc(ev.tel || "")}"></label></div>
    <label class="f">Observaciones (entrevista, práctica, referencias)<textarea id="evO" data-allow="1" maxlength="1500">${esc(ev.obs || "")}</textarea></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" id="evS"${API ? "" : " disabled"}>Guardar seguimiento</button><button class="btn danger" id="evX"${API ? "" : " disabled"}>Borrar aspirante</button><span id="evM" class="muted">${API ? "" : "Sin conexión configurada: no se puede guardar."}</span></div></div>` + reportHtml(row.R, row.P, EV.K);
  $("#evS").onclick = async () => {
    const pr = $("#evP").value.trim(), n = num(pr);
    if (pr !== "" && (isNaN(n) || n < 0 || n > 100)) { $("#evM").textContent = "La práctica debe estar entre 0 y 100."; return; }
    row.ev = { prac: pr === "" ? "" : n, dec: $("#evD").value, city: $("#evC").value.trim(), tel: $("#evT").value.trim(), obs: $("#evO").value.trim(), upd: Date.now() };
    $("#evS").disabled = true;
    try { await saveRow(row); $("#evM").textContent = "Seguimiento guardado."; drawTable(); } catch (e) { $("#evM").textContent = "No se pudo guardar (" + (e.message || "error") + ")."; }
    $("#evS").disabled = false;
  };
  $("#evX").onclick = () => confirmBox("¿Borrar a " + row.P.name + " de la base de datos?", "Se elimina el resultado y el seguimiento. No se puede deshacer.", async () => {
    try { await api({ a: "del", tok: EV.K.tok, id: row.id }); EV.rows = EV.rows.filter(r => r !== row); rep.innerHTML = ""; drawTable(); dbStatus(); } catch (e) { const mm = $("#evM"); if (mm) mm.textContent = "No se pudo borrar."; }
  });
  rep.scrollIntoView({ behavior: "smooth" });
}

async function copyTable() {
  const head = ["Fecha", "Nombre", "Documento", "Modalidad", "A", "B", "C", "D", "E", "F", "Total escrito", "Nivel", "Criticos fallados", "Perdidas de foco", "Practica", "Decision", "Ciudad", "Telefono", "Observaciones"];
  const clean = x => String(x === undefined ? "" : x).replace(/[\t\r\n]+/g, " ");
  const lines = [head.join("\t")].concat(EV.rows.map(r => [new Date(r.P.t1).toISOString().slice(0, 10), r.P.name, r.P.doc, r.P.mode, r.R.parts.A.got, r.R.parts.B.got, r.R.parts.C.got, r.R.parts.D.got, r.R.parts.E.got, r.R.parts.F.got, r.R.total, r.R.lvl, r.R.crit.length, r.P.blur, r.ev.prac, r.ev.dec || "Pendiente", r.ev.city, r.ev.tel, r.ev.obs].map(clean).join("\t")));
  try { await navigator.clipboard.writeText(lines.join("\n")); $("#hMsg").textContent = "Copiado: péguelo en Excel."; } catch (e) { $("#hMsg").textContent = "No se pudo copiar."; }
}

/* ---------- arranque ---------- */
if (loadSaved() && S && S.phase !== "done") {
  inExam = true;
  if (S.phase === "section") {
    const p = Q.parts[S.sec];
    if (Date.now() >= S.secStart + p.mins * 60000) endSection(true); else screenSection();
  } else screenInter();
} else if (S && S.phase === "done" && Q) screenDone();
else screenIntro(false);
</script>
</body>
</html>
